<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play it back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECE4; --surface:#F4F7F2; --ink:#1C2A22; --muted:#5B6B61; --line:#C5D0C6;
  --rec:#C8323C; --ok:#2F8A4E; --play:#2C7A82; --listen:#A87A12; --idle:#7D8B82;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141D18; --surface:#1C2721; --ink:#E3EBE4; --muted:#93A399; --line:#2F3D35;
    --rec:#F0545D; --ok:#5CC27E; --play:#4FB3BC; --listen:#E0AE3C; --idle:#6F7E75; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141D18; --surface:#1C2721; --ink:#E3EBE4; --muted:#93A399; --line:#2F3D35;
  --rec:#F0545D; --ok:#5CC27E; --play:#4FB3BC; --listen:#E0AE3C; --idle:#6F7E75; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:17px; line-height:1.4; -webkit-tap-highlight-color:transparent}
main{max-width:520px; margin:0 auto; padding:14px 18px 32px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, summary:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--ink); outline-offset:3px}

/* top bar */
.bar{display:flex; justify-content:space-between; align-items:center; min-height:44px}
.bar h1{font-size:1.05rem; font-weight:600; margin:0}
details.settings > summary{list-style:none; width:44px; height:44px; display:grid; place-items:center;
  border-radius:50%; color:var(--muted); cursor:pointer}
details.settings > summary::-webkit-details-marker{display:none}
details.settings[open] > summary{color:var(--ink); background:var(--surface)}
.panel{position:absolute; left:0; right:0; margin:6px auto 0; max-width:484px; z-index:5;
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px 6px;
  box-shadow:0 12px 32px color-mix(in srgb, var(--ink) 18%, transparent)}
.wrap{position:relative}
.set{display:grid; grid-template-columns:7.5em 1fr 3.4em; align-items:center; gap:10px; margin-bottom:12px; font-size:.95rem}
.set output{color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; font-size:.9rem}
.set input[type=range]{width:100%; accent-color:var(--play); height:28px; margin:0}
.set input[type=range]:disabled{opacity:.35}
.set select{grid-column:2 / 4; font:inherit; font-size:.95rem; padding:6px 8px; border-radius:8px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink)}
.set .check{grid-column:2 / 4; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.9rem}
.set .check input{width:20px; height:20px; accent-color:var(--play); margin:0}
#thr{direction:rtl}

/* the big button */
.stage{display:flex; flex-direction:column; align-items:center; gap:12px; margin:10px 0 22px}
.orbbox{position:relative}
.orb{--c:var(--idle); --lvl:0;
  width:min(56vw,210px); aspect-ratio:1; border-radius:50%; border:none; position:relative;
  background:var(--surface);
  box-shadow:0 0 0 calc(4px + var(--lvl)*28px) color-mix(in srgb, var(--c) 20%, transparent), inset 0 0 0 9px var(--c);
  transition:box-shadow 70ms linear;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px}
.orb svg{width:52px; height:52px; color:var(--c)}
.orb .state{font-size:1.05rem; font-weight:600; color:var(--c)}
.orb .timer{font-size:2.2rem; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--c); line-height:1}
.orb.idle{--c:var(--idle)} .orb.listening{--c:var(--listen)} .orb.recording{--c:var(--rec)}
.orb.playing,.orb.cooldown{--c:var(--play)}
.off{position:absolute; right:-8px; bottom:-4px; width:44px; height:44px; border-radius:50%;
  border:1px solid var(--line); background:var(--bg); display:none; place-items:center; color:var(--muted)}
.off svg{width:18px; height:18px}
.active .off{display:grid}
canvas{width:100%; height:40px; display:block; border-radius:8px; visibility:hidden}
.active canvas{visibility:visible}

.err{background:color-mix(in srgb,var(--rec) 14%,var(--surface)); border-left:4px solid var(--rec);
  padding:10px 14px; border-radius:6px; font-size:.92rem; display:none; margin:6px 0 12px}

/* sheet */
.sheet{background:var(--surface); border-radius:14px; padding:12px 12px 12px; margin-bottom:16px}
.sheet-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:0 4px}
.sheet-head h2{margin:0; font-size:1rem; font-weight:600}
.sheet-meta{color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums}
#paper{min-height:80px; overflow-x:auto}
#paper svg{max-width:100%}
.sheet-empty{color:var(--muted); font-size:.95rem; padding:26px 4px; text-align:center}
.notelist{color:var(--muted); font-size:.85rem; padding:0 4px; line-height:1.7; word-spacing:.15em}
.notelist .sharp,.notelist .flat{color:var(--rec); font-weight:600}

/* takes */
.takes{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; margin:0 -2px; scrollbar-width:none}
.takes::-webkit-scrollbar{display:none}
.chip{flex:none; display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px;
  border:1px solid var(--line); background:transparent; font-size:.9rem; font-variant-numeric:tabular-nums}
.chip svg{width:12px; height:12px; color:var(--play)}
.chip.shown{background:var(--play); border-color:var(--play); color:var(--bg)}
.chip.shown svg{color:var(--bg)}
.chip.clear{color:var(--muted); border-style:dashed}
.beatring{position:absolute; inset:-14px; border-radius:50%; border:3px solid var(--ink); opacity:0; pointer-events:none}
.metro{display:flex; align-items:center; gap:6px}
.metro button{border:1px solid var(--line); background:transparent; height:44px; border-radius:999px}
.metro .step{width:44px; font-size:1.3rem; line-height:1; color:var(--muted)}
.metro .tog{min-width:104px; padding:0 16px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--muted)}
.metro.on .tog{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.metro:not(.on) .step{visibility:hidden}
.dots{display:flex; gap:10px; height:10px; align-items:center}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--line)}
.dots i:first-child{width:10px; height:10px}
.dots i.now{background:var(--ink)}
.metro:not(.on) + .dots{visibility:hidden}
.firstnote{display:flex; align-items:center; gap:6px; padding:8px 4px 2px; flex-wrap:wrap}
.firstnote .lab{color:var(--muted); font-size:.85rem; margin-right:2px}
.firstnote button{height:36px; min-width:40px; padding:0 10px; border-radius:999px; border:1px solid var(--line);
  background:transparent; display:grid; place-items:center; font-size:.85rem; color:var(--ink)}
.firstnote button svg{width:22px; height:22px}
.firstnote button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.right{display:flex; align-items:center; gap:2px}
.iconbtn{width:44px; height:44px; border-radius:50%; border:none; background:transparent; color:var(--muted); display:grid; place-items:center}
.iconbtn.on{color:var(--ink); background:var(--surface)}
.panel.tpanel{top:100%}
.tpanel label{display:block; font-weight:600; font-size:.95rem; margin-bottom:8px}
.tpanel input{width:100%; font:inherit; font-size:1.05rem; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); letter-spacing:.02em}
.tpanel .btns{display:flex; gap:8px; margin:12px 0 10px}
.tpanel .btns button{height:40px; padding:0 18px; border-radius:999px; border:1px solid var(--line); background:transparent; font-weight:600}
.tpanel .btns .primary{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.tpanel .perr{color:var(--rec); font-size:.9rem; min-height:1.2em; margin-bottom:6px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.seg button{border:none; background:transparent; padding:5px 12px; font-size:.85rem; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.score{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding:4px 4px 0; font-size:.9rem; color:var(--muted)}
.score strong{color:var(--ink); font-size:1.05rem; font-weight:600}
.score i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:1px}
.tpanel input + input{margin-top:8px; font-size:.95rem}
.saved{display:flex; flex-direction:column; border-top:1px solid var(--line); margin:4px -2px 8px}
.saved .item{display:flex; align-items:center; border-bottom:1px solid var(--line)}
.saved .load{flex:1; text-align:left; border:none; background:transparent; padding:9px 2px; min-height:44px}
.saved .load b{display:block; font-weight:600; font-size:.95rem}
.saved .load span{color:var(--muted); font-size:.82rem}
.saved .del{width:44px; height:44px; border:none; background:transparent; color:var(--muted); font-size:1.2rem}
.hear{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px; border-radius:999px;
  border:1px solid var(--line); background:transparent; font-size:.88rem; font-weight:600; margin:8px 4px 2px}
.hear svg{width:12px; height:12px; color:var(--play)}
.chip.speed[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
/* tuner */
.tuner{text-align:center; padding:6px 0 4px}
.tuner .tn{font-size:3.4rem; font-weight:800; letter-spacing:-.03em; line-height:1; min-height:1em; font-variant-numeric:tabular-nums}
.tuner .tn small{font-size:1.3rem; font-weight:600; color:var(--muted); margin-left:2px}
.tuner .tc{color:var(--muted); font-variant-numeric:tabular-nums; margin:6px 0 12px; min-height:1.4em}
.tuner .scale{position:relative; height:44px; margin:0 6px}
.tuner .scale::before{content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:var(--line)}
.tuner .mid{position:absolute; left:50%; top:4px; bottom:4px; width:2px; margin-left:-1px; background:var(--muted)}
.tuner .ticks{position:absolute; inset:0; display:flex; justify-content:space-between; align-items:center; pointer-events:none}
.tuner .ticks span{width:1px; height:12px; background:var(--line)}
.tuner .needle{position:absolute; left:50%; top:2px; bottom:2px; width:6px; margin-left:-3px; border-radius:3px; background:var(--listen); transition:transform 90ms linear}
.tuner .needle.good{background:var(--ok)}
.tuner .ends{display:flex; justify-content:space-between; color:var(--muted); font-size:.8rem; margin:4px 2px 12px}
.tuner .strings{display:flex; justify-content:center; gap:8px; margin-bottom:10px}
.tuner .strings span{width:44px; height:36px; border-radius:999px; border:1px solid var(--line); display:grid; place-items:center; font-weight:600; color:var(--muted)}
.tuner .strings span.near{border-color:var(--ink); color:var(--ink)}
.tuner .strings span.good{background:var(--ok); border-color:var(--ok); color:var(--bg)}
/* pitch curve */
#pitchWrap{overflow-x:auto; border-radius:8px; margin-top:4px; position:relative}
#playhead{position:absolute; top:0; height:220px; width:2px; margin-left:-1px; background:var(--play); pointer-events:none}
.pb-hl{fill:var(--play); fill-opacity:.28}
.notelist span.now{color:var(--bg); background:var(--play); border-radius:4px; padding:0 3px; margin:0 -3px}
#pitchWrap canvas{display:block; height:220px; width:auto; visibility:visible; border-radius:0}
.share{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px; border-radius:999px;
  border:1px solid var(--line); background:transparent; font-size:.88rem; font-weight:600; margin:8px 4px 2px}
.share svg{width:15px; height:15px}
.sheet-head .left{display:flex; align-items:baseline; gap:8px; min-width:0}
.metro .drone{padding:0 14px; margin-left:6px; color:var(--muted); font-weight:600}
.metro .drone[aria-pressed="true"]{background:var(--play); border-color:var(--play); color:var(--bg)}
.metro:not(.on) .step{visibility:hidden}
.toast{background:var(--ink); color:var(--bg); border-radius:12px; padding:10px 14px; margin-bottom:10px; font-weight:600; font-size:.95rem; text-align:center}
.prog{margin:14px 4px 2px}
.prog .cap{font-size:.85rem; color:var(--muted); margin-bottom:6px}
.prog .bars{display:flex; gap:4px}
.prog .bar{flex:1; display:flex; flex-direction:column; align-items:center}
.prog .col{height:56px; width:100%; display:flex; align-items:flex-end; justify-content:center}
.prog .col span{width:100%; max-width:16px; background:var(--ok); border-radius:3px 3px 0 0; min-height:2px}
.prog .bar.none .col span{background:var(--line); height:2px}
.prog .bar em{font-style:normal; font-size:.7rem; color:var(--muted); margin-top:3px}
.prog .ptxt{font-size:.9rem; margin-top:8px}
@media (prefers-reduced-motion: reduce){ .orb{transition:none} .tuner .needle{transition:none} }
</style>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.7.2/dist/abcjs-basic-min.js"></script>
</head>
<body>
<main>
  <div class="wrap">
    <div class="bar">
      <h1>Play it back</h1>
      <div class="right">
      <button class="iconbtn" id="tunerBtn" aria-label="Tuner" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3v8a3 3 0 0 0 6 0V3M12 14v7M9 21h6"/></svg></button>
      <button class="iconbtn" id="targetBtn" aria-label="Notes to play" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></button>
      <details class="settings" id="settings">
        <summary aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></summary>
        <div class="panel">
          <div class="set"><label for="thr">Sensitivity</label><input type="range" id="thr" min="0.15" max="0.9" step="0.01" value="0.45"><output id="thrVal"></output></div>
          <div class="set"><label for="sil">Stop after</label><input type="range" id="sil" min="0.5" max="5" step="0.1" value="1.5"><output id="silVal"></output></div>
          <div class="set"><label for="rep">Repeat</label><input type="range" id="rep" min="0" max="4" step="1" value="1"><output id="repVal"></output></div>
          <div class="set"><label for="ladder">Speed up</label>
            <select id="ladder"><option value="0">Off</option><option value="2">After 2 clean takes</option><option value="3">After 3 clean takes</option><option value="5">After 5 clean takes</option></select></div>
          <div class="set"><label for="ladderStep">By</label>
            <select id="ladderStep"><option value="2">2 bpm</option><option value="4" selected>4 bpm</option><option value="6">6 bpm</option></select></div>
          <div class="set"><label for="bpb">Beats per bar</label>
            <select id="bpb"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
          <div class="set"><label for="bpm">Tempo</label><input type="range" id="bpm" min="40" max="200" step="1" value="90"><output id="bpmVal"></output></div>
          <div class="set"><span></span><label class="check"><input type="checkbox" id="autoBpm" checked> Detect from my playing</label></div>
          <div class="set"><label for="tuning">Tuning</label>
            <select id="tuning"><option value="438">A = 438</option><option value="439">A = 439</option><option value="440" selected>A = 440</option><option value="441">A = 441</option><option value="442">A = 442</option><option value="443">A = 443</option><option value="444">A = 444</option><option value="445">A = 445</option></select></div>
          <div class="set"><label for="droneNote">Drone note</label>
            <select id="droneNote"><option value="auto">Key of the music</option><option value="0">C</option><option value="1">C♯ / D♭</option><option value="2">D</option><option value="3">E♭</option><option value="4">E</option><option value="5">F</option><option value="6">F♯</option><option value="7">G</option><option value="8">A♭</option><option value="9">A</option><option value="10">B♭</option><option value="11">B</option></select></div>
          <div class="set"><label for="clef">Clef</label>
            <select id="clef">
              <option value="auto">Automatic</option>
              <option value="treble">Treble</option>
              <option value="bass">Bass</option>
              <option value="guitar">Guitar</option>
            </select></div>
          <input type="checkbox" id="auto" checked hidden>
        </div>
      </details>
      </div>
      <div class="panel tpanel" id="tunerPanel" hidden>
        <div class="tuner">
          <div class="tn" id="tNote">–</div>
          <div class="tc" id="tCents">Play a note</div>
          <div class="scale"><div class="ticks"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="mid"></div><div class="needle" id="tNeedle"></div></div>
          <div class="ends"><span>Flat</span><span>Sharp</span></div>
          <div class="strings" id="tStrings"><span data-m="55">G</span><span data-m="62">D</span><span data-m="69">A</span><span data-m="76">E</span></div>
        </div>
      </div>
      <div class="panel tpanel" id="targetPanel" hidden>
        <label for="targetIn">Notes to play</label>
        <input id="targetIn" placeholder="G3 A B C4 D E F# G" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <input id="targetName" placeholder="Name, to save it" autocomplete="off" enterkeyhint="done">
        <div class="btns"><button class="primary" id="targetUse">Use</button><button id="targetSave">Save</button><button id="targetClear">Clear</button></div>
        <div class="perr" id="targetErr"></div>
        <div class="saved" id="savedList"></div>
      </div>
    </div>
  </div>

  <div class="err" id="err"></div>

  <div class="stage" id="stage">
    <div class="orbbox">
      <button class="orb idle" id="orb" aria-label="Start">
        <span id="icon"></span>
        <span class="timer" id="timer" hidden></span>
        <span class="state" id="stateText"></span>
        <span id="hint" hidden></span>
      </button>
      <span class="beatring" id="beatring"></span>
      <button class="off" id="offBtn" aria-label="Turn off mic"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
    </div>
    <div class="metro" id="metro">
      <button class="step" id="mMinus" aria-label="Slower">−</button>
      <button class="tog" id="mToggle" aria-pressed="false">♩ 72</button>
      <button class="step" id="mPlus" aria-label="Faster">+</button>
      <button class="drone" id="droneBtn" aria-pressed="false">Drone</button>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <canvas id="meter" aria-hidden="true"></canvas>
  </div>

  <div class="toast" id="toast" hidden role="status"></div>
  <section class="sheet" id="sheet" aria-live="polite">
    <div class="sheet-head"><span class="left"><h2 id="sheetTitle"></h2><span class="sheet-meta" id="sheetKey"></span></span><span class="sheet-meta" id="sheetMeta"></span></div>
    <div id="paper"></div>
    <div id="pitchWrap" hidden><canvas id="pitch"></canvas><div id="playhead" hidden></div></div>
    <div class="notelist" id="notelist"></div>
    <div class="firstnote" id="firstnote" hidden>
      <span class="lab">First note</span>
      <button data-v="auto" aria-label="Detect automatically">Auto</button>
      <button data-v="2" aria-label="Eighth note"></button>
      <button data-v="4" aria-label="Quarter note"></button>
      <button data-v="6" aria-label="Dotted quarter note"></button>
      <button data-v="8" aria-label="Half note"></button>
    </div>
  </section>

  <div class="takes" id="takes"></div>
  <button id="clear" hidden></button>
</main>

<script>
// ---- Transcription: one note at a time ----
function detectNotes(data, sr, A4){
  A4=A4||440;
  const factor=Math.max(1,Math.round(sr/11025)), fs=sr/factor;
  const n=Math.floor(data.length/factor), x=new Float32Array(n);
  for(let i=0;i<n;i++){ let s=0,b=i*factor; for(let k=0;k<factor;k++) s+=data[b+k]; x[i]=s/factor; }
  const W=Math.round(fs*0.04), hop=Math.round(fs*0.01);
  const tauMin=Math.floor(fs/1400), tauMax=Math.ceil(fs/55);
  const frames=Math.max(0,Math.floor((n-W-tauMax)/hop));
  const rms=new Float32Array(frames), pitch=new Array(frames).fill(null);
  const d=new Float32Array(tauMax+1), cm=new Float32Array(tauMax+1);
  for(let f=0;f<frames;f++){
    const st=f*hop; let e=0;
    for(let j=0;j<W;j++) e+=x[st+j]*x[st+j];

}

// One quick pitch reading for the live tuner. Returns a fractional MIDI number or null.
function livePitch(buf, sr, A4){
  const factor=Math.max(1,Math.round(sr/11025)), fs=sr/factor, n=Math.floor(buf.length/factor), x=new Float32Array(n);
  let e=0; for(let i=0;i<n;i++){ let s=0; for(let k=0;k<factor;k++) s+=buf[i*factor+k]; x[i]=s/factor; e+=x[i]*x[i]; }

function guessTempo(notes){
  const iois=[]; for(let i=1;i<notes.length;i++){ const v=notes[i].t0-notes[i-1].t0; if(v>0.08&&v<2.5) iois.push(v); }

// "The first note is a quarter" (or eighth, half...): take the first note as beat 1,
// let its length set the beat, then fit the tempo to the whole take.
function tempoFromFirst(notes,val){
  if(!notes.length) return null;
  const t0=notes[0].t0;
  if(notes.length<2) return {bpm:Math.max(30,Math.min(240,60/((notes[0].t1-t0)/val*4))), ref:t0};
  const six0=(notes[1].t0-t0)/val;
  // note lengths in sixteenths, with a small cost for the less common ones
  const NICE=[[2,0],[4,0],[8,0],[16,0],[6,0.1],[12,0.1],[3,0.3],[1,0.3]];
  // search near the first note's length for the beat that makes all note lengths simple
  let best=six0, bs=Infinity;
  for(let r=0.6; r<=1.6; r+=0.005){
    const six=six0*r; let sc=0, c=0;
    for(let i=1;i<notes.length;i++){
      const x=(notes[i].t0-notes[i-1].t0)/six; if(x>17) continue;
      let e=Infinity; for(const [k,cost] of NICE) e=Math.min(e, Math.abs(x-k)/k*4 + cost + (k===val?0:0.15)); sc+=e; c++;
    }
    sc = c ? sc/c : 0;
    sc += 1.5*Math.log(r)**2;          // stay close to what the first note suggests
    if(sc<bs){ bs=sc; best=six; }
  }

  let sk=0,sp=0,skk=0,skp=0,n=0;
  for(const no of notes){ const P=no.t0-t0, k=Math.round(P/best); sk+=k; sp+=P; skk+=k*k; skp+=k*P; n++; }
  const den=n*skk-sk*sk;
  if(den>0){ const fit=(n*skp-sk*sp)/den; if(Math.abs(fit/best-1)<0.1) best=fit; }
  return {bpm:Math.max(30,Math.min(240,60/(best*4))), ref:t0};
}

function quantize(notes,bpm,refOverride){
  if(!notes.length) return [];
  const six=60/bpm/4, ref=(refOverride!==undefined)?refOverride:notes[0].t0;

  const q=t=>Math.round((t-ref)/six/g)*g;
  const ev=notes.map(n=>({midi:n.midi, s:q(n.t0), e:q(n.t1)}));
  for(let i=1;i<ev.length;i++) if(ev[i].s<=ev[i-1].s) ev[i].s=ev[i-1].s+g;

    if(i<ev.length-1){ const ns=ev[i+1].s; if(ns-o.e<=g) o.e=ns; o.e=Math.min(o.e,ns); }

  const L=ev[ev.length-1]; if(g===2 && L.e-L.s>4) L.e=L.s+Math.max(4,Math.round((L.e-L.s)/4)*4);

const SHARP_SP=[['C',0],['C',1],['D',0],['D',1],['E',0],['F',0],['F',1],['G',0],['G',1],['A',0],['A',1],['B',0]];
const FLAT_SP =[['C',0],['D',-1],['D',0],['E',-1],['E',0],['F',0],['G',-1],['G',0],['A',-1],['A',0],['B',-1],['B',0]];
const KEYS=[
  {name:'C',pc:0,flat:false,sig:{}},
  {name:'G',pc:7,flat:false,sig:{F:1}},
  {name:'D',pc:2,flat:false,sig:{F:1,C:1}},
  {name:'A',pc:9,flat:false,sig:{F:1,C:1,G:1}},
  {name:'E',pc:4,flat:false,sig:{F:1,C:1,G:1,D:1}},
  {name:'F',pc:5,flat:true,sig:{B:-1}},
  {name:'Bb',pc:10,flat:true,sig:{B:-1,E:-1}},
  {name:'Eb',pc:3,flat:true,sig:{B:-1,E:-1,A:-1}},
  {name:'Ab',pc:8,flat:true,sig:{B:-1,E:-1,A:-1,D:-1}},

const MAJOR=[0,2,4,5,7,9,11];
function guessKey(notes){
  if(!notes.length) return KEYS[0];
  let best=KEYS[0], bs=-1;
  for(const k of KEYS){
    let sc=0;
    for(const n of notes){ if(MAJOR.includes(((n.midi-k.pc)%12+12)%12)) sc+=(n.t1-n.t0); }
    const total=notes.reduce((a,n)=>a+n.t1-n.t0,0);
    if(notes[notes.length-1].midi%12===k.pc) sc+=total*0.08;
    if(notes[0].midi%12===k.pc) sc+=total*0.05;
    sc-=Object.keys(k.sig).length*total*0.005;   // prefer simpler keys on a tie
    if(sc>bs){ bs=sc; best=k; }

function spell(m,key){ const [L,a]=(key&&key.flat?FLAT_SP:SHARP_SP)[m%12]; return {L,a,oct:Math.floor(m/12)-1}; }
function noteName(m,key){ const {L,a,oct}=spell(m,key); return L+(a>0?'♯':a<0?'♭':'')+oct; }

// `map`, if given, gets one entry per drawn note head (tied pieces included):
// the index of the event it belongs to. Used to light up the note being played.
function toAbc(ev,bpm,mode,barsPerLine,key,beats,map){
  key=key||KEYS[0]; beats=beats||4;
  const BAR=beats*4, VALID=[16,12,8,6,4,3,2,1];
  const shift = mode==='guitar'?12:0;
  let clef='treble';
  if(mode==='bass') clef='bass';
  else if(mode==='auto' && ev.length){ const ms=ev.map(e=>e.midi).sort((a,b)=>a-b); if(ms[ms.length>>1]<57) clef='bass'; }
  let body='', pos=0, bars=0, acc={};
  const pitchStr=m=>{
    m+=shift; const {L,a,oct}=spell(m,key), k=L+oct;
    const cur = (k in acc) ? acc[k] : (key.sig[L]||0);
    let pre='';
    if(cur!==a){ pre = a>0?'^':a<0?'_':'='; acc[k]=a; }

    body += (midi===null?'z':pitchStr(midi)) + (len>1?len:'') + (tie?'-':'');

  };

    while(len>0){
      const room=BAR-(pos%BAR); let rem=Math.min(len,room);

        if(midi===null){
          const toBeat=(4-pos%4)%4;
          if(toBeat){ v=Math.min(rem,toBeat); if(v===3 && pos%2) v=1; }   // fill up to the beat first

// ---- Target: notes typed by the player ----
// "G3 A B C4 D E F# G": a missing octave means the nearest one to the previous note.
function parseTarget(str){
  const toks=str.replace(/[,|]/g,' ').trim().split(/\s+/).filter(Boolean);
  const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const notes=[]; let hasOct=false, prev=null;
  for(const tok of toks){
    const m=tok.match(/^([A-Ga-g])(#{1,2}|♯|x|bb|b|♭)?(-?\d)?$/);
    if(!m) return {error:tok};
    const base=PC[m[1].toUpperCase()];
    const acc = !m[2] ? 0 : (m[2]==='##'||m[2]==='x') ? 2 : (m[2]==='#'||m[2]==='♯') ? 1 : m[2]==='bb' ? -2 : -1;
    let midi;
    if(m[3]!==undefined){ midi=(+m[3]+1)*12+base+acc; hasOct=true; }
    else if(prev===null) midi=60+base+acc;
    else { let best=null; for(let o=0;o<9;o++){ const c=(o+1)*12+base+acc; if(best===null || Math.abs(c-prev)<Math.abs(best-prev) || (Math.abs(c-prev)===Math.abs(best-prev) && c>best)) best=c; } midi=best; }
    notes.push(midi); prev=midi;
  }
  return {notes, hasOct};
}

// Line up what was played with the target, allowing for missed and extra notes.
function alignTarget(target, played, matchOctave){
  const tryShift=sh=>{
    const T=target.map(m=>m+sh), P=played.map(n=>n.midi), n=T.length, k=P.length;
    const D=[...Array(n+1)].map(()=>new Array(k+1).fill(0));
    for(let i=0;i<=n;i++) D[i][0]=i; for(let j=0;j<=k;j++) D[0][j]=j;
    for(let i=1;i<=n;i++) for(let j=1;j<=k;j++){
      const sub = T[i-1]===P[j-1] ? 0 : 1;
      D[i][j]=Math.min(D[i-1][j-1]+sub, D[i-1][j]+1, D[i][j-1]+1);
    }
    // walk back
    const res=new Array(n).fill(null); let i=n, j=k, extra=0;
    while(i>0||j>0){
      if(i>0&&j>0 && D[i][j]===D[i-1][j-1]+(T[i-1]===P[j-1]?0:1)){ res[i-1]={played:played[j-1], same:T[i-1]===P[j-1]}; i--; j--; }
      else if(i>0 && D[i][j]===D[i-1][j]+1){ res[i-1]=null; i--; }
      else { extra++; j--; }
    }
    return {cost:D[n][k], res, extra, shift:sh};
  };
  let best=tryShift(0);
  if(!matchOctave){
    for(const sh of [-12,12,-24,24,-36,36]){ const r=tryShift(sh); if(r.cost<best.cost) best=r; }
  }
  const items=target.map((m,i)=>{
    const r=best.res[i], midi=m+best.shift;
    if(!r) return {midi, status:'missed'};
    if(!r.same) return {midi, status:'wrong', played:r.played};
    return {midi, status: Math.abs(r.played.cents)>=20 ? 'tune' : 'ok', played:r.played, cents:r.played.cents};
  });

}

// ---- Slow down without changing pitch (WSOLA time-stretch) ----
function stretch(x, rate){
  const N=2048, Hs=512, Ha=Math.round(Hs*rate), tol=256;
  const outLen=Math.floor(x.length/rate), out=new Float32Array(outLen+N), norm=new Float32Array(outLen+N);
  const win=new Float32Array(N); for(let i=0;i<N;i++) win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
  let prev=0;
  for(let k=0; k*Hs<outLen; k++){
    const nominal=k*Ha; let pos=nominal;
    if(k>0){
      // pick the input spot that best continues the previous frame
      const ref=prev+Hs; let best=-Infinity;
      for(let d=-tol; d<=tol; d+=2){
        const c=nominal+d; if(c<0 || c+N>x.length) continue;
        let s=0; for(let i=0;i<N;i+=8) s+=x[c+i]*(x[ref+i]||0);
        if(s>best){ best=s; pos=c; }
      }
    }
    pos=Math.max(0,Math.min(pos,x.length-N));
    const o=k*Hs;
    for(let i=0;i<N;i++){ out[o+i]+=win[i]*(x[pos+i]||0); norm[o+i]+=win[i]; }
    prev=pos;
  }
  const y=new Float32Array(outLen);
  for(let i=0;i<outLen;i++) y[i]= norm[i]>1e-3 ? out[i]/norm[i] : 0;
  return y;
}

  async function start(){

  function prerollLen0(){ return chunks.reduce((a,c)=>a+c.length,0); }
  function silenceLimit(){ return metro.on ? Math.max(1,Math.round(+sil.value))*beatLen() : +sil.value; }

  function onAudio(e){
    const input = e.inputBuffer.getChannelData(0);
    const buf = new Float32Array(input);   // copy, the browser reuses the buffer
    let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
    const rms=Math.sqrt(sum/buf.length);
    const db = 20*Math.log10(rms+1e-9);
    level = Math.max(0, Math.min(1, (db+60)/60));   // -60 dB..0 dB → 0..1
    const now = ac.currentTime, T=+thr.value;
    if(tunerOpen){ tunerFeed(buf); return; }

    if(state==='listening'){

      if(level>=T){
        chunks = preroll.slice(); preroll=[]; prerollLen=0;
        recAudioStart = now - prerollLen0()/ac.sampleRate;

      chunks.push(buf);

        if(silentSince===null) silentSince=now;
        else if(now-silentSince >= silenceLimit()) finishTake();

    const keep = Math.max(0, Math.round(total - silentSamples + TAIL*sr));
    total = Math.min(total, keep);

    for(const c of chunks){ if(off>=total) break; const n=Math.min(c.length,total-off); data.set(c.subarray(0,n),off); off+=n; }

    if(musical < MIN_LEN){ setState(active?'listening':'idle'); return; }

    // short fades so the edges don't click
    const f=Math.min(256,total>>2);
    for(let i=0;i<f;i++){ data[i]*=i/f; data[total-1-i]*=i/f; }

    else setState(active?'listening':'idle');
    setTimeout(()=>{ take.A=A4(); take.notes=detectNotes(data,sr,A4()); take.bpm=guessTempo(take.notes); take.key=guessKey(take.notes); onAnalyzed(take); if(shownTake===take) renderSheet(); },60);
  }

  async function playTake(take, times){
    stopPlayback();

    if(ac.state==='suspended') await ac.resume();

  function renderPitch(t){

  }
  function updatePlayhead(){
    if(!hl) return;
    const pos=playPos(), isTune=playing && playing.take.id==='target';
    if(hl.pitchX){
      const ph=$('playhead'), on=pos!==null && !isTune && playing.take===hl.take && pos<=hl.dur;
      if(ph.hidden!==!on) ph.hidden=!on;
      if(on){ const x=hl.pitchX(pos), w=$('pitchWrap'); ph.style.left=x+'px';
        if(x<w.scrollLeft+20 || x>w.scrollLeft+w.clientWidth-20) w.scrollLeft=Math.max(0,x-w.clientWidth*0.25); }
      return;
    }
    let idx=-1;
    if(pos!==null && isTune){
      if(hl.target){ const i=Math.floor(pos/playing.take.beat); if(i<hl.els.length) idx=i; }
    } else if(pos!==null && hl.times && playing.take===hl.take){
      // the last note that has started; let it go a moment after it ends
      for(let i=0;i<hl.times.length;i++){ const tt=hl.times[i]; if(tt && tt[0]<=pos+0.03) idx=i; }
      if(idx>=0 && pos>hl.times[idx][1]+0.25) idx=-1;
    }
    markNote(idx);
  }

  function draw(){
    updatePlayhead();
    const dpr=window.devicePixelRatio||1, w=canvas.clientWidth, h=canvas.clientHeight;
    if(canvas.width!==w*dpr||canvas.height!==h*dpr){ canvas.width=w*dpr; canvas.height=h*dpr; }
    const cs=getComputedStyle(document.documentElement);
    const col={idle:'--idle',listening:'--listen',recording:'--rec',playing:'--play',cooldown:'--play'};
    const live = (state==='playing'||state==='cooldown') ? 0 : level;
    history.push({v:live, c:cs.getPropertyValue(col[state]).trim()});
    const bars=Math.floor(w/4); while(history.length>bars) history.shift();
    ctx2.setTransform(dpr,0,0,dpr,0,0); ctx2.clearRect(0,0,w,h);
    history.forEach((p,i)=>{
      const bh=Math.max(2,p.v*(h-8)); ctx2.fillStyle=p.c;
      ctx2.fillRect(w-(history.length-i)*4, (h-bh)/2, 3, bh);
    });
    // threshold line (mirrored, since bars are centered)
    const ty=(h-(+thr.value)*(h-8))/2;
    ctx2.strokeStyle=cs.getPropertyValue('--ink').trim(); ctx2.globalAlpha=.55;
    ctx2.setLineDash([5,5]); ctx2.lineWidth=1;
    ctx2.beginPath(); ctx2.moveTo(0,ty); ctx2.lineTo(w,ty); ctx2.moveTo(0,h-ty); ctx2.lineTo(w,h-ty); ctx2.stroke();
    ctx2.setLineDash([]); ctx2.globalAlpha=1;

    const ring=$('beatring');
    if(metro.on){
      const pos=(clock()-metro.t0)/beatLen();
      if(pos>=0){
        const idx=Math.floor(pos), frac=pos-idx, inBar=((idx%metro.bpb)+metro.bpb)%metro.bpb;
        const pulse=Math.max(0,1-frac*3.5), accent=inBar===0;
        ring.style.opacity=(pulse*(accent?1:0.45)).toFixed(3);
        ring.style.borderWidth=accent?'5px':'3px';
        if(draw.lastIdx!==idx){ draw.lastIdx=idx; [...$('dots').children].forEach((d,i)=>d.classList.toggle('now',i===inBar)); }
      } else ring.style.opacity=0;
    } else if(ring.style.opacity!=='0'){ ring.style.opacity=0; [...$('dots').children].forEach(d=>d.classList.remove('now')); }
    orb.style.setProperty('--lvl', state==='recording'||state==='listening' ? live.toFixed(3) : 0);
    if(state==='recording' && ac) timer.textContent=fmt(ac.currentTime-recStart);
    requestAnimationFrame(draw);
  }
  setState('idle'); renderSheet(); renderMetro();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
